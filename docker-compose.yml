services:
  postgres:
    image: postgres:16-alpine
    container_name: twindeo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: twindeo
      POSTGRES_PASSWORD: twindeo_dev_password
      POSTGRES_DB: twindeo
    ports:
      - "5432:5432"
    volumes:
      - twindeo_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twindeo -d twindeo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  twindeo_pgdata:
